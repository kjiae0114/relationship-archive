
name: Deploy relationship-archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relationship-archive-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh
        working-directory: 'C:\programming\01_web\relationship-archive'

    steps:
      - name: Check required tools
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw "Git is not installed or not in PATH."
          }
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw "Docker CLI is not installed or not in PATH."
          }
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not available."
          }

      - name: Check local changes
        run: |
          git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot check Git working tree."
          }
          $changes = git status --porcelain
          if ($changes) {
            throw "Local changes exist. Commit or safely preserve them before deployment."
          }

      - name: Update source from GitHub
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Git fetch failed."
          }

          git merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Fast-forward update failed. Check local branch state."
          }

      - name: Validate Compose configuration
        run: |
          docker compose config -q
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose configuration validation failed."
          }

      - name: Build and deploy
        run: |
          $expectedSha = (git rev-parse HEAD).Trim()
          if ($expectedSha -notmatch '^[0-9a-f]{40}$') {
            throw "Cannot determine the expected Git SHA."
          }

          $env:BUILD_SHA = $expectedSha
          Write-Host "Building and deploying commit $expectedSha"

          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed."
          }

      - name: Verify application health
        run: |
          $healthy = $false

          for ($i = 1; $i -le 12; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8000/api/health" `
                -Method Get `
                -TimeoutSec 5 `
                -UseBasicParsing

              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                $healthy = $true
                Write-Host "Application health check passed."
                break
              }
            }
            catch {
              Write-Host "Health check attempt $i/12 failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            docker compose ps
            docker compose logs --tail 80 app
            throw "Application health check failed."
          }

      - name: Verify deployed commit
        run: |
          $expectedSha = (git rev-parse HEAD).Trim()
          $version = $null
          $verified = $false

          for ($i = 1; $i -le 12; $i++) {
            try {
              $version = Invoke-RestMethod `
                -Uri "http://127.0.0.1:8000/api/version" `
                -TimeoutSec 5

              if ($version.sha -eq $expectedSha) {
                $verified = $true
                break
              }

              Write-Host "Attempt $i/12: app SHA '$($version.sha)' does not match '$expectedSha'."
            }
            catch {
              Write-Host "Version check attempt $i/12 failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $verified) {
            docker compose ps
            docker compose logs --tail 80 app
            throw "Running app SHA does not match expected commit $expectedSha."
          }

          $containerId = (docker compose ps -q app)
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to query the running app container."
          }

          $containerId = $containerId.Trim()
          if (-not $containerId) {
              throw "Cannot find the running app container."
          }

          $imageSha = docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' $containerId
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to inspect the running app container image."
          }

          $imageSha = $imageSha.Trim()
          if ($imageSha -ne $expectedSha) {
              throw "Image SHA '$imageSha' does not match expected commit '$expectedSha'."
          }

          Write-Host "Verified app and image commit: $expectedSha"

      - name: Show service status
        if: success()
        run: docker compose ps
